[build]
  command = "npm --prefix frontend ci && npm --prefix frontend run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify serves the bundle from the site root (Django served it under /static/).
  VITE_BASE = "/"
  # The booking API is a Netlify Function on the same origin (netlify/functions/contact.mjs).
  VITE_API_URL = "/api"

# Old Django static URLs (e.g. og-image links already shared) keep working.
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 301

# Client-side routing: unknown paths fall back to the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
