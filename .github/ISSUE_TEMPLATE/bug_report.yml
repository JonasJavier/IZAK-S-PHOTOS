name: Bug report
description: Report a reproducible problem in the site or API.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the project. Do not include secrets or real booking information.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
      placeholder: Describe the visible behavior and expected result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Page or API route
      placeholder: /projects or /api/contact/
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Local development
        - Both
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add a screenshot or sanitized log excerpt if it helps. Remove personal data and credentials first.

