[build]
builder = "RAILPACK"
buildCommand = "python -m pip install --upgrade pip && python -m pip install -r requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build && python backend/manage.py collectstatic --noinput"

[deploy]
preDeployCommand = "python backend/manage.py migrate"
startCommand = "gunicorn --chdir backend backend.wsgi:application --bind 0.0.0.0:$PORT"
healthcheckPath = "/api/health/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10